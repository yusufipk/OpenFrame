# Weekly PRs for newer Docker base images (tags and digests), a few days after each release.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - '/'
      - '/scripts/minio-test'
      - '/tests/build'
    schedule:
      interval: weekly
    # wait a few days after a release before proposing it, so a hijacked release can be pulled first
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

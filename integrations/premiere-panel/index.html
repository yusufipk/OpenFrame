<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: sans-serif;
        font-size: 12px;
        color: #ddd;
        padding: 8px 10px;
        margin: 0;
      }
      label {
        display: block;
        margin: 8px 0 2px;
      }
      input[type='text'],
      input[type='password'],
      select {
        width: 100%;
        margin: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      #server {
        margin-top: 2px;
        font-size: 11px;
        color: #999;
      }
      #status {
        margin-top: 8px;
        white-space: pre-wrap;
      }
      #status.error {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <label for="link">OpenFrame video link</label>
    <input id="link" type="text" placeholder="https://open-frame.net/projects/…/videos/…" />
    <div id="server"></div>
    <label for="token">API token (Read and Read comments)</label>
    <input id="token" type="password" />
    <div class="row">
      <button id="load">Load versions</button>
    </div>
    <label for="version">Version</label>
    <select id="version"></select>
    <div class="row">
      <input id="resolved" type="checkbox" checked />
      <label for="resolved" style="margin: 0">Include resolved comments</label>
    </div>
    <div class="row">
      <button id="sync" disabled>Add comments to the active sequence</button>
    </div>
    <div id="status"></div>
    <script src="panel.js"></script>
  </body>
</html>

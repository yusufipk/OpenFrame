services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DOCKER_DB_HOST: postgres
      DOCKER_DB_PORT: '5432'
      MINIO_HEALTHCHECK_URL: http://minio:9000/minio/health/live
    ports:
      - '3000:3000'
    restart: unless-stopped

  live-review:
    profiles: ['live-review']
    build:
      context: .
      dockerfile: Dockerfile
    command: ['bun', 'run', 'start:live-review']
    env_file:
      - .env.docker
    environment:
      LIVE_REVIEW_APP_URL: http://app:3000
      LIVE_REVIEW_PORT: '3101'
    depends_on:
      - app
    ports:
      - '127.0.0.1:3101:3101'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3101/health', {headers: {'X-Live-Review-Secret': process.env.LIVE_REVIEW_SECRET}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=200'
      - '-c'
      - 'shared_buffers=256MB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'effective_cache_size=1GB'
      - '-c'
      - 'maintenance_work_mem=128MB'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    # ---------------------------------------------------------------------------
    # MinIO image source
    #
    # The official `minio/minio` image is no longer available on Docker Hub or
    # Quay.io. MinIO stopped publishing free community edition images on
    # October 23, 2025, and the Docker Hub repository has been deleted.
    #
    # The default below uses a community-maintained drop-in replacement.
    # Other verified alternatives are listed for reference; uncomment one
    # line and comment out the others if you prefer a different source.
    #
    #   coollabsio/minio:latest       (default, drop-in, no permission changes)
    #   ghcr.io/golithus/minio:latest (multi-arch, GitHub Container Registry)
    #   cgr.dev/chainguard/minio:latest (distroless, may need volume permission adjustments)
    #
    # After changing the image, run:
    #   docker compose pull minio
    #   docker compose up --build
    # ---------------------------------------------------------------------------
    image: coollabsio/minio:latest
    # image: ghcr.io/golithus/minio:latest
    # image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
